<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Chat: the adapter boundary</title><desc id="desc">Validate a message and check allowance, save it, display pending state, call the local scripted adapter, save the reply, then optionally star it.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a08ab3" stroke-width="1.2"/></marker></defs><rect width="960" height="360" rx="16" fill="#faf8fc"/><g font-family="Arial,sans-serif" fill="#4a3b5b"><text x="35" y="40" font-size="21" font-weight="600">Chat: the adapter boundary</text><rect x="35" y="87" width="200" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="135" y="116" text-anchor="middle" font-size="15" font-weight="600">Submit message</text><text x="135" y="138" text-anchor="middle" font-size="11" fill="#7d6d8c">Validate + allowance</text><polyline points="235,123 270,123" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="87" width="200" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="370" y="116" text-anchor="middle" font-size="15" font-weight="600">Save user message</text><text x="370" y="138" text-anchor="middle" font-size="11" fill="#7d6d8c">MESSAGE action</text><polyline points="470,123 505,123" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="87" width="200" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="605" y="116" text-anchor="middle" font-size="15" font-weight="600">Pending screen</text><text x="605" y="138" text-anchor="middle" font-size="11" fill="#7d6d8c">600 ms demo delay</text><polyline points="705,123 740,123" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="87" width="185" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="832.5" y="116" text-anchor="middle" font-size="15" font-weight="600">Scripted adapter</text><text x="832.5" y="138" text-anchor="middle" font-size="11" fill="#7d6d8c">services.js replyTo()</text><polyline points="832,159 832,230 705,230" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="195" width="200" height="72" rx="12" fill="#edf1e8" stroke="#d8cce3"/><text x="605" y="224" text-anchor="middle" font-size="15" font-weight="600">Save reply</text><text x="605" y="246" text-anchor="middle" font-size="11" fill="#7d6d8c">REPLY action</text><polyline points="505,230 470,230" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="195" width="200" height="72" rx="12" fill="#faeee6" stroke="#d8cce3"/><text x="370" y="224" text-anchor="middle" font-size="15" font-weight="600">Render / optional star</text><text x="370" y="246" text-anchor="middle" font-size="11" fill="#7d6d8c">STAR toggles an ID</text><text x="35" y="322" font-size="12" fill="#84728f">A real model call belongs behind a server API. The local adapter is deterministic and has no API key.</text></g></svg>