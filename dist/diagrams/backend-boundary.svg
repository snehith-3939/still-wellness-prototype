<svg xmlns="http://www.w3.org/2000/svg" width="960" height="395" viewBox="0 0 960 395" role="img" aria-labelledby="title desc"><title id="title">A proposed real-service boundary</title><desc id="desc">The browser calls an authenticated API. The API controls owned data, model credentials, authorized rooms, verified payments and scheduled delivery.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a08ab3" stroke-width="1.2"/></marker></defs><rect width="960" height="395" rx="16" fill="#faf8fc"/><g font-family="Arial,sans-serif" fill="#4a3b5b"><text x="35" y="40" font-size="21" font-weight="600">A proposed real-service boundary</text><rect x="35" y="160" width="170" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="120" y="189" text-anchor="middle" font-size="15" font-weight="600">Browser</text><text x="120" y="211" text-anchor="middle" font-size="11" fill="#7d6d8c">Untrusted client</text><polyline points="205,196 245,196" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="160" width="200" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="345" y="189" text-anchor="middle" font-size="15" font-weight="600">Authenticated API</text><text x="345" y="211" text-anchor="middle" font-size="11" fill="#7d6d8c">Ownership + entitlements</text><polyline points="445,196 485,196 485,106 530,106" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="70" width="180" height="72" rx="12" fill="#edf1e8" stroke="#d8cce3"/><text x="620" y="99" text-anchor="middle" font-size="15" font-weight="600">Owned records</text><text x="620" y="121" text-anchor="middle" font-size="11" fill="#7d6d8c">Database</text><polyline points="445,196 530,196" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="160" width="180" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="620" y="189" text-anchor="middle" font-size="15" font-weight="600">Assistant / rooms</text><text x="620" y="211" text-anchor="middle" font-size="11" fill="#7d6d8c">Server adapters</text><polyline points="445,196 485,196 485,286 530,286" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="250" width="180" height="72" rx="12" fill="#faeee6" stroke="#d8cce3"/><text x="620" y="279" text-anchor="middle" font-size="15" font-weight="600">Verified payments</text><text x="620" y="301" text-anchor="middle" font-size="11" fill="#7d6d8c">Webhook → ledger</text><polyline points="710,106 750,106" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="70" width="175" height="72" rx="12" fill="#edf1e8" stroke="#d8cce3"/><text x="837.5" y="99" text-anchor="middle" font-size="15" font-weight="600">Scheduled jobs</text><text x="837.5" y="121" text-anchor="middle" font-size="11" fill="#7d6d8c">Persistent delivery</text><polyline points="710,196 750,196" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="160" width="175" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="837.5" y="189" text-anchor="middle" font-size="15" font-weight="600">Model / realtime</text><text x="837.5" y="211" text-anchor="middle" font-size="11" fill="#7d6d8c">External services</text><text x="35" y="365" font-size="12" fill="#84728f">Proposed architecture for a future app. No assertion is made about the original service’s infrastructure.</text></g></svg>