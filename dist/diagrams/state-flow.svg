<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">One action, one shared state</title><desc id="desc">A user action reaches the controller and pure domain rules, which update shared state. The state is persisted locally and rendered into the screen.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a08ab3" stroke-width="1.2"/></marker></defs><rect width="960" height="380" rx="16" fill="#faf8fc"/><g font-family="Arial,sans-serif" fill="#4a3b5b"><text x="35" y="40" font-size="21" font-weight="600">One action, one shared state</text><rect x="35" y="95" width="170" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="120" y="124" text-anchor="middle" font-size="15" font-weight="600">User action</text><text x="120" y="146" text-anchor="middle" font-size="11" fill="#7d6d8c">Click or form submit</text><polyline points="205,131 245,131" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="95" width="190" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="340" y="124" text-anchor="middle" font-size="15" font-weight="600">Controller</text><text x="340" y="146" text-anchor="middle" font-size="11" fill="#7d6d8c">app.js</text><polyline points="435,131 475,131" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="95" width="190" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="570" y="124" text-anchor="middle" font-size="15" font-weight="600">Domain rule</text><text x="570" y="146" text-anchor="middle" font-size="11" fill="#7d6d8c">core.js reducer</text><polyline points="665,131 705,131" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="705" y="95" width="215" height="72" rx="12" fill="#eee8f5" stroke="#d8cce3"/><text x="812.5" y="124" text-anchor="middle" font-size="15" font-weight="600">Shared state</text><text x="812.5" y="146" text-anchor="middle" font-size="11" fill="#7d6d8c">createStore()</text><polyline points="813,167 813,240 665,240" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="205" width="190" height="72" rx="12" fill="#edf1e8" stroke="#d8cce3"/><text x="570" y="234" text-anchor="middle" font-size="15" font-weight="600">Browser storage</text><text x="570" y="256" text-anchor="middle" font-size="11" fill="#7d6d8c">Saved records</text><polyline points="475,240 435,240" fill="none" stroke="#a08ab3" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="205" width="190" height="72" rx="12" fill="#faeee6" stroke="#d8cce3"/><text x="340" y="234" text-anchor="middle" font-size="15" font-weight="600">Updated screen</text><text x="340" y="256" text-anchor="middle" font-size="11" fill="#7d6d8c">View + render()</text><text x="35" y="337" font-size="12" fill="#84728f">Independent prototype architecture. This does not describe Healo’s private systems.</text></g></svg>